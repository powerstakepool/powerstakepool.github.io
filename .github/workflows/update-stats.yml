name: Update pool stats

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from Koios
        env:
          POOL: pool1uk2f28awascuhrhuwrp7x6y87x8ch33vwx8jtmrysp7l5ngq78j
        run: |
          curl -sf -m 30 -X POST https://api.koios.rest/api/v1/pool_info \
            -H 'Content-Type: application/json' \
            -d "{\"_pool_bech32_ids\":[\"$POOL\"]}" > info.json
          curl -sf -m 30 "https://api.koios.rest/api/v1/pool_blocks?_pool_bech32=$POOL&order=block_height.desc&limit=40" > blocks.json
          curl -sf -m 30 "https://api.koios.rest/api/v1/tip" > tip.json
          jq -n --slurpfile i info.json --slurpfile b blocks.json --slurpfile t tip.json '
            $i[0][0] as $p
            | {
                live_stake: $p.live_stake, active_stake: $p.active_stake,
                live_delegators: $p.live_delegators, live_saturation: $p.live_saturation,
                margin: $p.margin, fixed_cost: $p.fixed_cost,
                block_count: $p.block_count,
                recent_blocks: [$b[0][:6][] | {height: .block_height, time: .block_time, epoch: .epoch_no, hash: .block_hash}],
                epoch: ($t[0][0] as $tip | {
                  no: $tip.epoch_no,
                  start: ($tip.block_time - $tip.epoch_slot),
                  length: 432000,
                  blocks: ([$b[0][] | select(.epoch_no == $tip.epoch_no)] | length)
                }),
                updated: (now | todate)
              }' > stats.new.json
          jq -e '.live_stake != null' stats.new.json
          mv stats.new.json stats.json
          rm info.json blocks.json tip.json

      - name: Commit if changed
        run: |
          if git diff --quiet -I '"updated"' -- stats.json; then
            echo "No change"; git checkout -- stats.json; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "Update pool stats"
          git push
